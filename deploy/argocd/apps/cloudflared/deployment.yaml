apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: testsight-system
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://web-ui.testsight-system.svc.cluster.local:80
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          # Quick tunnels are ephemeral; probes not reliable. Cloudflare manages
          # tunnel health externally. Restart on failure is expected behavior.