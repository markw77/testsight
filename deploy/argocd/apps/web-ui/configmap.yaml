apiVersion: v1
kind: ConfigMap
metadata:
  name: web-ui-html
  namespace: testsight-system
  labels:
    app: web-ui
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Testsight Web UI</title>
      <style>
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          max-width: 800px;
          margin: 0 auto;
          padding: 2rem;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .card {
          background: white;
          border-radius: 16px;
          box-shadow: 0 20px 60px rgba(0,0,0,0.3);
          padding: 3rem;
          text-align: center;
        }
        h1 { color: #333; margin-bottom: 1rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        .badge {
          display: inline-block;
          background: #667eea;
          color: white;
          padding: 0.5rem 1rem;
          border-radius: 9999px;
          font-size: 0.875rem;
          font-weight: 600;
          margin-bottom: 1.5rem;
        }
        .info { text-align: left; background: #f7fafc; border-radius: 8px; padding: 1.5rem; margin-top: 2rem; }
        .info h3 { margin-top: 0; color: #4a5568; }
        .info p { margin: 0.5rem 0; font-family: monospace; font-size: 0.875rem; }
        .footer { margin-top: 2rem; color: #999; font-size: 0.875rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="badge">Deployed via Argo CD</div>
        <h1>Testsight Web UI</h1>
        <p class="subtitle">Simple nginx app served through Cloudflare Tunnel</p>
        <div class="info">
          <h3>Deployment Info</h3>
          <p>Namespace: testsight-system</p>
          <p>Image: nginx:alpine</p>
          <p>Service: ClusterIP (internal only)</p>
          <p>Tunnel: Cloudflare Quick Tunnel (trycloudflare.com)</p>
        </div>
        <div class="footer">
          Managed by Argo CD • Cloudflare Tunnel
        </div>
      </div>
    </body>
    </html>